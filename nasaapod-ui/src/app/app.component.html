<h1>{{ title }}</h1>

<div class="date-selector">
  <label for="date">Choose a date:</label>
  <input id="date" type="date" [(ngModel)]="selectedDate" />
  <button (click)="loadApod()">Load</button>
</div>

<hr />

<div *ngIf="apod; else loading">
  <h2>{{ apod.title }}</h2>
  <p><strong>Date:</strong> {{ apod.date }}</p>
  <img *ngIf="apod.url" [src]="apod.url" alt="{{ apod.title }}" width="500" />
  <p>{{ apod.explanation }}</p>
</div>

<ng-template #loading>
  <p>Loading Astronomy Picture of the Day...</p>
</ng-template>
